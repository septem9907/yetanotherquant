[project]
name = "yetanotherquant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "septem9907", email = "septem9907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.54",
    "polars>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "statsmodels>=0.14.0",
]

[project.scripts]
yetanotherquant = "yetanotherquant:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "ruff>=0.15.17",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"benchmarks/*.py" = ["E402"]
